[package]
name = "bisync-pos-desktop"
version = "0.1.0"
description = "Bisync POS P2P Local-First para Windows"
authors = ["Bisync"]
edition = "2021"

[lib]
name = "bisync_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

